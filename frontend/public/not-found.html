<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada - 404</title>
  <style>
    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #0f172a;
      text-align: center;
    }
    .container {
      background-color: white;
      padding: 3rem;
      border-radius: 2.5rem;
      box-shadow: 0 20px 50px -12px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 90%;
    }
    img.logo {
      width: 150px;
      height: auto;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 4rem;
      margin: 0;
      color: #2f8fc2;
    }
    h2 {
      font-size: 1.5rem;
      margin-top: 0;
      margin-bottom: 1rem;
    }
    p {
      color: #1a5a7a;
      margin-bottom: 2rem;
    }
    a.button {
      display: inline-block;
      background-color: #2f8fc2;
      background-image: linear-gradient(to right, #2f8fc2, #2679a8);
      color: white;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 9999px;
      font-weight: bold;
      box-shadow: 0 8px 20px -6px rgba(47,143,194,0.4);
      transition: all 0.2s;
    }
    a.button:hover {
      background-image: linear-gradient(to right, #2679a8, #0b3c5d);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo" src="/src/assets/logo.png" alt="Logo Mascotas">
    <h1>404</h1>
    <h2>Oops! Página no encontrada.</h2>
    <p>La página que estás buscando podría haber sido eliminada, haber cambiado de nombre, o estar temporalmente no disponible.</p>
    <a href="/" class="button">Volver al inicio</a>
  </div>
</body>
</html>
